name: Submit iOS to App Store

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Download IPA from draft release
        run: |
          mkdir -p ./ipa

          # Trouver la draft release par tag (fonctionne même sans tag git)
          RELEASE_ID=$(gh api repos/lassiapp33-sudo/lassiapp/releases \
            --jq '[.[] | select(.tag_name == "v-ipa-submit")][0].id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Erreur : draft release v-ipa-submit introuvable"
            exit 1
          fi

          echo "Release ID: $RELEASE_ID"

          # Récupérer l'URL de l'asset IPA
          ASSET_API_URL=$(gh api repos/lassiapp33-sudo/lassiapp/releases/$RELEASE_ID/assets \
            --jq '[.[] | select(.name | endswith(".ipa"))][0].url')

          if [ -z "$ASSET_API_URL" ] || [ "$ASSET_API_URL" = "null" ]; then
            echo "Erreur : aucun .ipa trouvé dans la release"
            exit 1
          fi

          echo "Téléchargement de : $ASSET_API_URL"

          # Télécharger l'IPA via l'API (fonctionne avec les drafts privés)
          gh api "$ASSET_API_URL" \
            --header "Accept: application/octet-stream" \
            > ./ipa/app.ipa

          ls -lh ./ipa/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Apple API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "${{ secrets.APPLE_API_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Submit to App Store Connect
        run: |
          IPA_PATH=$(find ./ipa -name "*.ipa" | head -1)
          echo "Submitting: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey ${{ secrets.APPLE_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APPLE_API_ISSUER_ID }} \
            --verbose
        timeout-minutes: 25

      - name: Cleanup draft release
        if: always()
        run: |
          gh release delete v-ipa-submit --yes --repo lassiapp33-sudo/lassiapp || true
          git push origin :v-ipa-submit 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
