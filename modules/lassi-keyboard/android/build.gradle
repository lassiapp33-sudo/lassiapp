plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'tech.lassi.keyboard'
version = '0.1.0'

android {
  namespace "tech.lassi.keyboard"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  // Garantit que le Kotlin est vu quel que soit le dossier conventionnel.
  sourceSets {
    main {
      java.srcDirs += ['src/main/kotlin']
    }
  }
  lintOptions {
    abortOnError false
  }
}
